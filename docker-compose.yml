version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - PUBLIC_BASE_URL=http://localhost:5000
      - DATABASE_URL=file:./dev.db
      - AI_PROVIDER=mock
      - MOCK_GENERATION_SECONDS=5
    volumes:
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      - ./backend/prisma/dev.db:/app/backend/prisma/dev.db
